name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python -m pytest
      - name: offline demo + replay
        run: |
          stigdev demo --runs-root /tmp/ci-runs --run-id ci-demo
          stigdev replay /tmp/ci-runs/ci-demo
